<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormulaConvert - 單位換算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-button {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            background: white;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .tab-button:hover {
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 0 8px 8px 8px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .converter-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .converter-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #667eea;
            border-radius: 2px;
        }

                .converter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 15px;
        }

        .converter-row.single {
            grid-template-columns: 1fr;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
        }

        .input-wrapper {
            display: flex;
            gap: 5px;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]::placeholder {
            color: #bbb;
        }

        input[type="number"]:read-only {
            background-color: #f0f0f0;
            color: #000;
            cursor: not-allowed;
            border-color: #d0d0d0;
        }

        input[type="number"]:read-only:focus {
            border-color: #d0d0d0;
            box-shadow: none;
        }

        .unit-label {
            padding: 10px 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .result-display {
            padding: 10px 12px;
            background: #f0f7ff;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 14px;
            color: #0066cc;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            text-align: right;
        }

        .result-display.empty {
            background: #f5f5f5;
            border-color: #e0e0e0;
            color: #0066cc;
        }


        input[type="number"] {
            background-color: #fffacd !important;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            font-size: 12px;
            color: #333;
        }

        table input[type="number"] {
            background-color: #fffacd !important;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            font-size: 12px;
            color: #333;
        }

        table th {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            text-align: left;
        }

        table td {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #333;
        }

        table input[type="number"] {
            font-family: 'Courier New', monospace !important;
            font-size: 14px !important;
            color: #333 !important;
        }

        table .result-display {
            background-color: #f0f0f0 !important;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #000;
            font-weight: 600;
            border: none !important;
        }

        .arrow {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 0 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear {
            background: #f5f5f5;
            color: #666;
        }

        .btn-clear:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-export {
            background: #667eea;
            color: white;
        }

        .btn-export:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0097bc;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #0097bc;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }

            .header h1 {
                font-size: 24px;
            }

            .converter-row {
                grid-template-columns: 1fr;
            }

            .tab-button {
                min-width: 120px;
                padding: 10px 15px;
                font-size: 12px;
            }

            .tab-content {
                padding: 20px;
            }
        }
    </style>
</head>

            }

            if (d5 > 0) {
                const result = (d5 * CONSTANTS.LB_TO_KG).toFixed(1);

        function calculatePrice1() {
            const b11 = parseFloat(document.getElementById('b11').value) || 0;
            const c11 = parseFloat(document.getElementById('c11').value) || 0;

            // $/KG -> $/LB
            if (b11 > 0) {
                const result = (b11 * CONSTANTS.LB_TO_KG).toFixed(1);
                updateDisplay('d11', result);
            } else {
                updateDisplay('d11', '');
            }

            // $/KG -> $/YD
            if (b11 > 0 && c11 > 0) {
                const result = (b11 / (1000 / c11)).toFixed(1);
                updateDisplay('e11', result);
            } else {
                updateDisplay('e11', '');
            }
        }

        function calculatePrice2() {
            const b14 = parseFloat(document.getElementById('b14').value) || 0;
            const c14 = parseFloat(document.getElementById('c14').value) || 0;

            // $/LB -> $/KG

                updateDisplay('d14', result);
            } else {

            // $/LB -> $/YD

        // Page 2 計算函數
        function calculateYarnCount() {
            const b5 = parseFloat(document.getElementById('p2b5').value) || 0;
            const d5 = parseFloat(document.getElementById('p2d5').value) || 0;

            if (b5 > 0) {
                const result = ((0.4535924 * 1000) / (b5 * 840 * 0.9144 / 9000)).toFixed(1);
                updateDisplay('p2c5', result);
            } else {
                updateDisplay('p2c5', '');
            }

            if (d5 > 0) {
                const result = ((9000 / 0.9144 / 840) / (d5 / 1000 / 0.4535924)).toFixed(1);
                updateDisplay('p2e5', result);
            } else {
                updateDisplay('p2e5', '');
            }
        }

        function calculateBasisWeight(row) {
            if (row === 'row1') {
                const gsm = parseFloat(document.getElementById('p2bw1_gsm').value) || 0;
                const width = parseFloat(document.getElementById('p2bw1_width').value) || 0;

                if (gsm > 0 && width > 0) {
                    const gyd = (gsm * 0.0232257 * width).toFixed(1);
                    const ozsy = (gsm / 28.3495231 * 0.9144 * 0.9144).toFixed(1);
                    document.getElementById('p2bw1_gyd').textContent = gyd;
                    document.getElementById('p2bw1_ozsy').textContent = ozsy;
                } else {
                    document.getElementById('p2bw1_gyd').textContent = '-';
                    document.getElementById('p2bw1_ozsy').textContent = '-';
                }
            } else if (row === 'row2') {
                const gyd = parseFloat(document.getElementById('p2bw2_gyd').value) || 0;
                const width = parseFloat(document.getElementById('p2bw2_width').value) || 0;

                if (gyd > 0 && width > 0) {
                    const gsm = (gyd / 0.0232257 / width).toFixed(1);
                    const ozsy = ((gyd / 28.3495231) / (width / 36)).toFixed(1);
                    document.getElementById('p2bw2_gsm').textContent = gsm;
                    document.getElementById('p2bw2_ozsy').textContent = ozsy;
                } else {
                    document.getElementById('p2bw2_gsm').textContent = '-';
                    document.getElementById('p2bw2_ozsy').textContent = '-';
                }
            } else if (row === 'row3') {
                const ozsy = parseFloat(document.getElementById('p2bw3_ozsy').value) || 0;
                const width = parseFloat(document.getElementById('p2bw3_width').value) || 0;

                if (ozsy > 0 && width > 0) {
                    const gyd = (ozsy * 28.3495231 * (width / 36)).toFixed(1);
                    const gsm = (ozsy * 28.3495231 / (0.9144 * 0.9144)).toFixed(1);
                    document.getElementById('p2bw3_gyd').textContent = gyd;
                    document.getElementById('p2bw3_gsm').textContent = gsm;
                } else {
                    document.getElementById('p2bw3_gyd').textContent = '-';
                    document.getElementById('p2bw3_gsm').textContent = '-';
                }
            }
        }

        function calculateKnitLength(kit) {
            if (kit === 'kit1') {
                const kg = parseFloat(document.getElementById('p2kit1_kg').value) || 0;
                const width = parseFloat(document.getElementById('p2kit1_width').value) || 0;
                const gsm = parseFloat(document.getElementById('p2kit1_gsm').value) || 0;

                if (kg > 0 && width > 0 && gsm > 0) {
                    const yds = (kg * 1000 / (gsm * 0.0232257 * width) * 10).toFixed(1);
                    document.getElementById('p2kit1_yds').textContent = yds;
                } else {
                    document.getElementById('p2kit1_yds').textContent = '-';
                }
            } else if (kit === 'kit2') {
                const lbs = parseFloat(document.getElementById('p2kit2_lbs').value) || 0;
                const width = parseFloat(document.getElementById('p2kit2_width').value) || 0;
                const gsm = parseFloat(document.getElementById('p2kit2_gsm').value) || 0;

                if (lbs > 0 && width > 0 && gsm > 0) {
                    const yds = (lbs * 0.4535924 * 1000 / (gsm * 0.0232257 * width) * 10).toFixed(1);
                    document.getElementById('p2kit2_yds').textContent = yds;
                } else {
                    document.getElementById('p2kit2_yds').textContent = '-';
                }
            } else if (kit === 'kit3') {
                const yds = parseFloat(document.getElementById('p2kit3_yds').value) || 0;
                const width = parseFloat(document.getElementById('p2kit3_width').value) || 0;
                const gsm = parseFloat(document.getElementById('p2kit3_gsm').value) || 0;

                if (yds > 0 && width > 0 && gsm > 0) {
                    const kg = (yds * (gsm * 0.0232257 * width) / 1000 / 10).toFixed(1);
                    document.getElementById('p2kit3_kg').textContent = kg;
                } else {
                    document.getElementById('p2kit3_kg').textContent = '-';
                }
            }
        }

        function calculateKnitWeight1() {
            const b17 = parseFloat(document.getElementById('p2b17').value) || 0;
            const c17 = parseFloat(document.getElementById('p2c17').value) || 0;
            const d17 = parseFloat(document.getElementById('p2d17').value) || 0;

        function calculateWovenS26() {
            const b26 = parseFloat(document.getElementById('p2b26').value) || 0;

            const d26 = parseFloat(document.getElementById('p2d26').value) || 0;
            const e26 = parseFloat(document.getElementById('p2e26').value) || 0;

            if (b26 > 0 && c26 > 0 && d26 > 0 && e26 > 0) {
                const result = ((1 / 0.9144 * 36 * b26 / 0.9144 / 840 / d26 * 0.4535924 * 1000) +
                               (1 / 0.9144 * 36 * c26 / 0.9144 / 840 / e26 * 0.4535924 * 1000)).toFixed(1);
                updateDisplay('p2g26', result);
            } else {
                updateDisplay('p2g26', '');
